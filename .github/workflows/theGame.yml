name: Go with JS UI Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. Set up Node.js to compile your Frontend UI
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20' # Change to your preferred Node version
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # 2. Build the JavaScript Frontend Assets
    - name: Build UI Frontend
      run: |
        cd ui
        npm install
        npm run build # Generates the dist folder

    # 3. Set up Go
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.2'

    # 4. Compile Go (which embeds the fresh ui/dist folder)
    # 4. Compile Go for multiple platforms (Embedding the fresh ui/dist folder)
    - name: Build Go Backend
      run: |
        VERSION=${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}
        
        # Build for Unix-based systems (Linux/macOS server deployments)
        # Generates a standard extensionless Unix binary named 'thegame-linux'
        ENV GOOS=linux GOARCH=amd64 go build -v \
          -ldflags "-X main.Version=${VERSION}" \
          -o bin/thegame-linux ./cmd

        # Build for Windows systems
        # Generates a Windows executable file named 'thegame-windows.exe'
        ENV GOOS=windows GOARCH=amd64 go build -v \
          -ldflags "-X main.Version=${VERSION}" \
          -o bin/thegame-windows.exe ./cmd

    - name: Test
      run: go test -v ./...
      
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: bin/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
